<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#151515">
<title>Життя</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --ground:#f3f1eb;--surface-1:#fbfaf7;--surface-2:#ffffff;--surface-3:#ebe8e0;--line:#d3d0c6;
  --ink:#1f1e1b;--ink-soft:#3a3935;--ink-muted:#5d5b55;
  --clay:#3d6b35;--on-clay:#ffffff;--clay-soft:#e3eedf;
  --ok:#3d6b35;--ok-soft:#e3eedf;--info:#2f5d99;--info-soft:#dfe8f4;--amber:#7a4e0c;--amber-soft:#f3e7cf;--danger:#b3263b;--danger-soft:#f7dfe1;
  --chart-1:#c4592f;--chart-2:#2a78d6;--chart-3:#16996b;--chart-4:#6b5bc4;
  --scrim:#1f1e1b59;
  --shadow-tray:inset 0 1px 0 #ffffffcc,0 6px 20px #1f1e1b14;
  --shadow-btn:inset 0 1px 0 #ffffffb3;
  --shadow-lift:0 6px 16px #1f1e1b14;
  --focus-ring:0 0 0 2px #f4f2ec,0 0 0 4px #3d6b35;
  --font-sans:Onest,-apple-system,"Segoe UI",Roboto,sans-serif;
  --text-2xs:11px;--text-xs:11.5px;--text-sm:12px;--text-md:13px;--text-base:14px;--text-lg:15px;--text-xl:16px;--text-2xl:18px;--text-3xl:20px;
  --space-05:2px;--space-1:4px;--space-2:8px;--space-3:12px;--space-4:12px;--space-5:16px;--space-6:20px;--space-8:24px;
  --radius-2xs:4px;--radius-xs:6px;--radius-sm:10px;--radius-md:12px;--radius-lg:18px;--radius-full:9999px;
  --control-xs:24px;--control-sm:28px;--control-ms:30px;--control-md:32px;--control-lg:40px;--control-xl:44px;
  --dur-instant:80ms;--dur-fast:150ms;--dur-base:200ms;--dur-slow:320ms;--dur-slower:480ms;
  --ease-out:cubic-bezier(.2,.9,.3,1);--ease-spring:cubic-bezier(.3,1.35,.5,1);--ease-in:cubic-bezier(.5,0,.75,0);
  --opacity-disabled:.45;
  --state-hover:color-mix(in srgb,var(--ink) 6%,transparent);
  --state-press:color-mix(in srgb,var(--ink) 11%,transparent);
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --ground:#151515;--surface-1:#20201e;--surface-2:#323232;--surface-3:#434343;--line:#3a3a38;
    --ink:#ecebe6;--ink-soft:#c9c8c4;--ink-muted:#b2b1ab;
    --clay:#93c48b;--on-clay:#151515;--clay-soft:#1f2b1e;
    --ok:#93c48b;--ok-soft:#1f2b1e;--info:#8fb3e0;--info-soft:#1c2633;--amber:#e0b24a;--amber-soft:#33291a;--danger:#f5979e;--danger-soft:#3a1f22;
    --chart-1:#e0703f;--chart-2:#3987e5;--chart-3:#199e70;--chart-4:#9085e9;
    --scrim:#0000008c;
    --shadow-tray:inset 0 1px 0 #ffffff14,0 8px 24px #00000080;
    --shadow-btn:inset 0 1px 0 #ffffff12;
    --shadow-lift:0 6px 16px #00000059;
    --focus-ring:0 0 0 2px #151515,0 0 0 4px #93c48b;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --ground:#151515;--surface-1:#20201e;--surface-2:#323232;--surface-3:#434343;--line:#3a3a38;
  --ink:#ecebe6;--ink-soft:#c9c8c4;--ink-muted:#b2b1ab;
  --clay:#93c48b;--on-clay:#151515;--clay-soft:#1f2b1e;
  --ok:#93c48b;--ok-soft:#1f2b1e;--info:#8fb3e0;--info-soft:#1c2633;--amber:#e0b24a;--amber-soft:#33291a;--danger:#f5979e;--danger-soft:#3a1f22;
  --chart-1:#e0703f;--chart-2:#3987e5;--chart-3:#199e70;--chart-4:#9085e9;
  --scrim:#0000008c;
  --shadow-tray:inset 0 1px 0 #ffffff14,0 8px 24px #00000080;
  --shadow-btn:inset 0 1px 0 #ffffff12;
  --shadow-lift:0 6px 16px #00000059;
  --focus-ring:0 0 0 2px #151515,0 0 0 4px #93c48b;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%;margin:0}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{background:var(--ground);color:var(--ink);font:400 var(--text-xl)/1.4 var(--font-sans);font-variant-numeric:tabular-nums slashed-zero;
  -webkit-font-smoothing:antialiased;overflow:hidden;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
button{font:inherit;color:inherit;margin:0;padding:0;border:0;background:none;cursor:pointer;-webkit-touch-callout:none}
button:disabled{opacity:var(--opacity-disabled);cursor:not-allowed}
svg{fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.hidden{display:none!important}

/* ───── каркас ───── */
.app{height:100%;max-width:760px;margin:0 auto;display:flex;flex-direction:column;gap:var(--space-2);
  padding:var(--space-2) var(--space-4) var(--space-3)}
.head{display:flex;align-items:center;gap:var(--space-2);min-height:var(--control-lg)}
.head h1{margin:0;flex:1;min-width:0;font:600 var(--text-3xl)/1.2 var(--font-sans);letter-spacing:-.02em}
.exhead{display:flex;align-items:center;gap:var(--space-2);min-height:var(--control-lg)}
.exhead h2{margin:0;flex:1;min-width:0;font:600 var(--text-2xl)/1.2 var(--font-sans);letter-spacing:-.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* сегменти */
.seg{display:inline-flex;gap:var(--space-05);padding:var(--space-1);border-radius:var(--radius-full);background:var(--surface-1);position:relative}
.seg button{height:var(--control-sm);min-width:34px;padding:0 var(--space-3);border-radius:var(--radius-full);color:var(--ink-muted);
  font:500 var(--text-md)/1 var(--font-sans);transition:background var(--dur-base),color var(--dur-base);position:relative;z-index:1}
.seg button[aria-checked="true"]{background:var(--surface-3);color:var(--ink)}
@media (hover:hover){.seg button:not([aria-checked="true"]):hover{color:var(--ink)}}
.seg.on-card{background:var(--ground)}

/* кнопки */
.ib{width:var(--control-lg);height:var(--control-lg);border-radius:var(--radius-full);background:var(--surface-3);box-shadow:var(--shadow-btn);
  display:grid;place-items:center;transition:transform var(--dur-instant),background var(--dur-fast)}
.ib svg{width:18px;height:18px}
.ib:active:not(:disabled){transform:scale(.9)}
.ib.ghost{background:transparent;box-shadow:none}
.ib.ghost:active:not(:disabled){background:var(--state-press)}
@media (hover:hover){.ib.ghost:hover:not(:disabled){background:var(--state-hover)}}
.ib.armed{background:var(--danger)!important;color:var(--on-clay)!important}
.ib.glass{background:color-mix(in srgb,var(--surface-2) 86%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);box-shadow:var(--shadow-btn)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:var(--space-2);height:var(--control-md);padding:0 var(--space-4);
  border-radius:var(--radius-full);font:500 var(--text-lg)/1 var(--font-sans);white-space:nowrap;transition:transform var(--dur-instant),filter var(--dur-fast)}
.btn:active:not(:disabled){transform:scale(.96)}
.btn svg{width:18px;height:18px}
.btn-primary{background:var(--clay);color:var(--on-clay)}
.btn-secondary{background:var(--surface-3);color:var(--ink);box-shadow:var(--shadow-btn)}
.btn-lg{height:var(--control-xl);padding:0 var(--space-5) 0 var(--space-4);min-width:96px}
@media (hover:hover){.btn-primary:hover:not(:disabled){filter:brightness(1.05);box-shadow:0 4px 14px color-mix(in srgb,var(--clay) 18%,transparent)}}
.chip{flex:none;height:var(--control-md);padding:0 var(--space-3);border-radius:var(--radius-full);background:var(--ground);color:var(--ink-soft);
  font:500 var(--text-md)/1 var(--font-sans);transition:background var(--dur-base),color var(--dur-base),transform var(--dur-instant)}
.chip:active{transform:scale(.96)}
.chip[aria-checked="true"]{background:var(--surface-3);color:var(--ink)}
@media (hover:hover){.chip:hover{color:var(--ink)}}
:is(.ib,.btn,.chip,.seg button,.tool,.card,.tgl,.switch,.wchip,.sheet-close,.tpl):focus-visible{outline:2px solid transparent;box-shadow:var(--focus-ring)}

/* ───── сцена ───── */
.stage{position:relative;flex:1;min-height:180px;border-radius:var(--radius-lg);background:var(--surface-1);overflow:hidden;touch-action:none;cursor:crosshair}
.stage.hand{cursor:grab}
.stage canvas{position:absolute;inset:0;width:100%;height:100%;display:block}

.stage .cv3{touch-action:none;cursor:grab}
.stage .cv3:active{cursor:grabbing}
.app[data-screen="3d"] #cv{display:none!important}
.app:not([data-screen="3d"]) .cv3{display:none!important}   /* Three.js ставить inline display:block */
.ctx input[type=range]{min-width:48px;flex:1}
.ctx .tname{flex:none}
.ov-tl{position:absolute;left:var(--space-2);top:var(--space-2);display:flex;flex-direction:column;align-items:flex-start;gap:var(--space-1);max-width:calc(100% - 64px)}
.ros{display:flex;gap:var(--space-1);pointer-events:none}
.ro-spark{display:flex;align-items:center;gap:var(--space-2)}
.ro{background:color-mix(in srgb,var(--surface-2) 86%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  border-radius:var(--radius-sm);padding:var(--space-1) var(--space-2);line-height:1.15;min-width:52px}
.ro b{display:block;font:600 var(--text-lg)/1.25 var(--font-sans);font-variant-numeric:tabular-nums slashed-zero}
.ro span{font-size:var(--text-2xs);color:var(--ink-muted);white-space:nowrap}
.ro canvas{position:static;display:block;width:56px;height:28px}
.ov-tr{position:absolute;right:var(--space-2);top:var(--space-2);display:flex;flex-direction:column;gap:var(--space-1)}
.wchip{display:inline-flex;align-items:center;gap:var(--space-1);height:var(--control-md);padding:0 var(--space-2) 0 var(--space-3);border-radius:var(--radius-full);
  background:color-mix(in srgb,var(--surface-2) 86%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);box-shadow:var(--shadow-btn);
  font:500 var(--text-md)/1 var(--font-sans);max-width:200px;transition:transform var(--dur-instant)}
.wchip:active{transform:scale(.96)}
.wchip span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.wchip small{color:var(--ink-muted);font-size:var(--text-sm)}
.wchip svg{width:16px;height:16px;color:var(--ink-muted)}
.hint{position:absolute;left:var(--space-2);bottom:var(--space-2);font-size:var(--text-2xs);color:var(--ink-muted);
  background:color-mix(in srgb,var(--surface-2) 82%,transparent);border-radius:var(--radius-full);padding:var(--space-1) var(--space-2);pointer-events:none;
  transition:opacity var(--dur-slow) var(--ease-out);max-width:calc(100% - 16px);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* ───── пісочниця: контекст і док ───── */
.ctx{display:flex;align-items:center;gap:var(--space-2);min-height:var(--control-xl);padding:var(--space-1) var(--space-1) var(--space-1) var(--space-3);
  background:var(--surface-1);border-radius:var(--radius-md)}
.ctx .tname{font:600 var(--text-md)/1.2 var(--font-sans);white-space:nowrap}
.ctx .tdesc{font-size:var(--text-sm);color:var(--ink-muted);flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ctx .opts{display:flex;align-items:center;justify-content:flex-end;gap:var(--space-1);flex:1;min-width:0}
.ctx .scroll{display:flex;gap:var(--space-1);overflow-x:auto;scrollbar-width:none;min-width:0;flex:1;
  -webkit-mask-image:linear-gradient(90deg,#000 85%,transparent);mask-image:linear-gradient(90deg,#000 85%,transparent)}
.ctx .scroll::-webkit-scrollbar{display:none}
.ctx .ib{width:var(--control-md);height:var(--control-md)}
.dock{display:flex;gap:var(--space-05);padding:var(--space-1);border-radius:var(--radius-full);background:var(--surface-1)}
.tool{flex:1;min-width:0;height:var(--control-lg);border-radius:var(--radius-full);color:var(--ink-muted);display:grid;place-items:center;
  transition:background var(--dur-base),color var(--dur-base),transform var(--dur-instant)}
.tool svg{width:20px;height:20px}
.tool:active{transform:scale(.9)}
.tool[aria-checked="true"]{background:var(--surface-3);color:var(--ink)}
@media (hover:hover){.tool:not([aria-checked="true"]):hover{color:var(--ink);background:var(--state-hover)}}

/* ───── лоток ───── */
.tray{display:flex;align-items:center;gap:var(--space-2);background:var(--surface-2);box-shadow:var(--shadow-tray);border-radius:var(--radius-lg);padding:var(--space-2)}
.tray .seg{margin-left:auto}

/* ───── довідник ───── */
.list{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;margin:0 calc(-1 * var(--space-4));padding:0 var(--space-4) var(--space-6);overscroll-behavior:contain}
.list h3{margin:var(--space-6) 0 var(--space-2);font:600 var(--text-sm)/1.2 var(--font-sans);color:var(--ink-muted)}
.list h3:first-child{margin-top:var(--space-2)}
.cards{display:flex;flex-direction:column;gap:var(--space-1)}
.card{display:flex;align-items:center;gap:var(--space-3);width:100%;text-align:left;padding:var(--space-2);border-radius:var(--radius-md);background:var(--surface-1);
  transition:transform var(--dur-instant),background var(--dur-fast)}
.card:active{transform:scale(.98)}
@media (hover:hover){.card:hover{background:color-mix(in srgb,var(--surface-1) 92%,var(--ink))}}
.card canvas{width:56px;height:56px;border-radius:var(--radius-sm);background:var(--ground);flex:none}
.card .ct{flex:1;min-width:0}
.card b{display:block;font:600 var(--text-lg)/1.25 var(--font-sans)}
.card span{display:block;font-size:var(--text-md);color:var(--ink-muted);line-height:1.35}
.card > svg{width:16px;height:16px;color:var(--ink-muted)}
.lead{margin:var(--space-2) 0 0;font-size:var(--text-base);color:var(--ink-soft);line-height:1.45}

/* ───── експонат ───── */
.info{background:var(--surface-1);border-radius:var(--radius-md);padding:var(--space-3);display:flex;flex-direction:column;gap:var(--space-2)}
.info p{margin:0;font-size:var(--text-base);line-height:1.45;color:var(--ink-soft)}
.info .note{font-size:var(--text-sm);color:var(--ink-muted)}
.row{display:flex;align-items:center;gap:var(--space-2);flex-wrap:wrap}
.status{display:inline-flex;align-items:center;gap:var(--space-1);height:var(--control-xs);padding:0 var(--space-2);border-radius:var(--radius-full);
  font:500 var(--text-sm)/1 var(--font-sans);background:var(--surface-3);color:var(--ink-soft);white-space:nowrap}
.status.ok{background:var(--ok-soft);color:var(--ok)}
.bar{flex:1;min-width:100px;height:6px;border-radius:var(--radius-full);background:var(--surface-3);overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--ink-muted);border-radius:inherit;transition:width var(--dur-base) var(--ease-out)}
.switch{display:inline-flex;align-items:center;gap:var(--space-2);font:500 var(--text-md)/1 var(--font-sans);min-height:var(--control-md)}
.switch .tr{width:40px;height:24px;border-radius:var(--radius-full);background:var(--surface-3);position:relative;transition:background var(--dur-base)}
.switch .tr::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:var(--ink);transition:transform var(--dur-slow) var(--ease-spring)}
.switch[aria-checked="true"] .tr{background:var(--clay)}
.switch[aria-checked="true"] .tr::after{transform:translateX(16px);background:var(--on-clay)}

/* ───── аркуш ───── */
.scrim{position:fixed;inset:0;background:var(--scrim);opacity:0;pointer-events:none;transition:opacity var(--dur-slow) var(--ease-out);z-index:40}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;max-width:760px;margin:0 auto;max-height:86vh;max-height:86dvh;display:flex;flex-direction:column;background:var(--surface-2);
  border-radius:var(--radius-lg) var(--radius-lg) 0 0;z-index:50;transform:translateY(105%);transition:transform var(--dur-slow) var(--ease-out);
  padding-bottom:env(safe-area-inset-bottom,0px)}
.sheet.on{transform:none}
.sheet-head{display:flex;align-items:center;gap:var(--space-2);padding:var(--space-2) var(--space-2) var(--space-2) var(--space-5);position:relative}
.sheet-head::before{content:"";position:absolute;top:6px;left:50%;width:36px;height:4px;margin-left:-18px;border-radius:var(--radius-full);background:var(--surface-3)}
.sheet-head h2{flex:1;margin:var(--space-3) 0 0;font:600 var(--text-3xl)/1.2 var(--font-sans);letter-spacing:-.02em}
.sheet-close{margin-top:var(--space-3)}
.sheet-body{overflow-y:auto;padding:var(--space-2) var(--space-5) var(--space-6);display:flex;flex-direction:column;gap:var(--space-3);overscroll-behavior:contain}
.sheet-body h4{margin:var(--space-2) 0 0;font:600 var(--text-sm)/1.2 var(--font-sans);color:var(--ink-muted)}
.sheet-body p{margin:0;font-size:var(--text-base);color:var(--ink-soft);line-height:1.45}
.wrap{display:flex;flex-wrap:wrap;gap:var(--space-1)}
.fam{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:var(--space-1)}
.fam button{display:flex;flex-direction:column;align-items:flex-start;gap:2px;padding:var(--space-2) var(--space-3);border-radius:var(--radius-md);background:var(--surface-1);text-align:left;
  transition:background var(--dur-base),transform var(--dur-instant);min-height:var(--control-xl)}
.fam button:active{transform:scale(.97)}
.fam button b{font:600 var(--text-md)/1.2 var(--font-sans)}
.fam button span{font-size:var(--text-2xs);color:var(--ink-muted)}
.fam button[aria-checked="true"]{background:var(--surface-3)}
.rulebox{display:flex;flex-direction:column;gap:var(--space-2);background:var(--surface-1);border-radius:var(--radius-md);padding:var(--space-3)}
.rulestr{font:600 var(--text-2xl)/1.2 var(--font-sans);letter-spacing:-.01em}
.digits{display:grid;grid-template-columns:56px repeat(9,1fr);gap:var(--space-05);align-items:center}
.digits > span{font-size:var(--text-sm);color:var(--ink-muted)}
.tgl{height:var(--control-md);border-radius:var(--radius-xs);background:var(--ground);color:var(--ink-muted);font:600 var(--text-md)/1 var(--font-sans);
  transition:background var(--dur-base),color var(--dur-base),transform var(--dur-instant)}
.tgl:active{transform:scale(.92)}
.tgl[aria-pressed="true"]{background:var(--ink);color:var(--ground)}
.stepper{display:inline-flex;align-items:center;gap:var(--space-2)}
.stepper b{min-width:24px;text-align:center;font:600 var(--text-lg)/1 var(--font-sans)}
.stepper .ib{width:var(--control-md);height:var(--control-md)}
.tpls{display:grid;grid-template-columns:repeat(8,1fr);gap:var(--space-1)}
.tpl{display:flex;flex-direction:column;align-items:center;gap:var(--space-1);padding:var(--space-1) 0;border-radius:var(--radius-xs);background:var(--ground);
  transition:transform var(--dur-instant)}
.tpl:active{transform:scale(.92)}
.tpl i{display:flex;gap:1px}
.tpl i u,.tpl em{display:block;width:8px;height:8px;border-radius:2px;background:var(--surface-3)}
.tpl i u.on{background:var(--ink-muted)}
.tpl em{width:8px}
.tpl[aria-pressed="true"] em{background:var(--ink)}
.slider{display:flex;align-items:center;gap:var(--space-2)}
.slider label{font-size:var(--text-sm);color:var(--ink-muted);width:24px}
.slider output{font-size:var(--text-sm);min-width:44px;text-align:right}
input[type=range]{flex:1;accent-color:var(--clay);height:var(--control-md)}
.rules{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:var(--space-2)}
.rules li{display:flex;gap:var(--space-3);align-items:flex-start;background:var(--surface-1);border-radius:var(--radius-md);padding:var(--space-3)}
.rules li svg{width:36px;height:36px;stroke:none}
.rules li p b{color:var(--ink)}
.legend{display:flex;flex-wrap:wrap;gap:var(--space-1) var(--space-3);font-size:var(--text-sm);color:var(--ink-muted)}
.legend span{display:inline-flex;align-items:center;gap:var(--space-1)}
.legend i{width:8px;height:8px;border-radius:2px;display:inline-block}

/* ───── тост ───── */

function rle(s){
  const out=[]; let x=0,y=0,m; const re=/(\d*)([bo$!])/g;

}

// 2D FFT (radix-2, in-place), S = степінь двійки
function makeFFT(S){
  const L=Math.log2(S), rev=new Uint32Array(S);
  for(let i=0;i<S;i++){let r=0;for(let b=0;b<L;b++)r|=((i>>b)&1)<<(L-1-b);rev[i]=r;}
  const cs=new Float64Array(S/2), sn=new Float64Array(S/2);
  for(let i=0;i<S/2;i++){cs[i]=Math.cos(2*Math.PI*i/S);sn[i]=-Math.sin(2*Math.PI*i/S);}
  const tr=new Float64Array(S),ti=new Float64Array(S);
  function f1(re,im,off,stride,inv){
    for(let i=0;i<S;i++){const j=off+rev[i]*stride;tr[i]=re[j];ti[i]=im[j];}
    for(let size=2;size<=S;size<<=1){const h=size>>1,st=S/size;
      for(let i=0;i<S;i+=size)for(let k=0;k<h;k++){
        const c=cs[k*st],s=inv?-sn[k*st]:sn[k*st],a=i+k,b=a+h;
        const xr=tr[b]*c-ti[b]*s, xi=tr[b]*s+ti[b]*c;
        tr[b]=tr[a]-xr;ti[b]=ti[a]-xi;tr[a]+=xr;ti[a]+=xi;}}
    for(let i=0;i<S;i++){const j=off+i*stride;re[j]=tr[i];im[j]=ti[i];}
  }
  return function fft2(re,im,inv){
    for(let y=0;y<S;y++)f1(re,im,y*S,1,inv);
    for(let x=0;x<S;x++)f1(re,im,x,S,inv);
    if(inv){const n=S*S;for(let i=0;i<n;i++){re[i]/=n;im[i]/=n;}}
  };
}

/* ───────── базовий всесвіт ───────── */
class World{
  constructor(){ this.acc=0; this.gen=0; }
  advance(dt,ix,budget){
    this.acc+=dt*this.speeds[ix];
    const t0=performance.now();
    while(this.acc>=1){ this.step(); this.acc--; if(performance.now()-t0>(budget||12)){ this.acc=Math.min(this.acc,1); break; } }
  }
  fxActive(){ return false; } fxTick(){}
  animated(){ return false; }
}

   rule.kind 'gen': B/S + C станів (C=2 — «Життя»-подібні, C>2 — Generations)
   rule.kind 'wire': Wireworld — 0 порожньо, 1 голова, 2 хвіст, 3 провід */
const GN=1024, MARGIN=4, GC=512;
const ANTI_PAINT=48, ANTI_FIRE=5;
const G_SE=[[1,0],[2,1],[0,2],[1,2],[2,2]];
const LWSS_E=rle('b4o$o3bo$4bo$o2bo!');

class GridWorld extends World{
  constructor(rule){
    super();
    const n=GN*GN;
    this.cur=new Uint8Array(n); this.nxt=new Uint8Array(n);
    this.kind=new Uint8Array(n); this.tst=new Float32Array(n); this.anti=new Uint8Array(n);
    this.type='grid'; this.reset(); this.setRule(rule||{kind:'gen',B:[3],S:[2,3],C:2});
  }
  reset(){
    this.cur.fill(0); this.nxt.fill(0); this.kind.fill(0); this.anti.fill(0);
    this.dNxt=null; this.bx0=this.by0=GN; this.bx1=this.by1=-1;
    this.abox=this.abPrev=null; this.gen=0; this.pop=0; this.explos=[]; this.aBox=null; this.acc=0;
  }
  get wire(){ return this.rule.kind==='wire'; }
  setRule(rule){
    this.rule=rule;
    if(rule.kind==='gen'){
      this.Bm=new Uint8Array(9); this.Sm=new Uint8Array(9);
      rule.B.forEach(n=>this.Bm[n]=1); rule.S.forEach(n=>this.Sm[n]=1);
      // чому клітина вмирає: замало сусідів (3) чи забагато (4)
      const sMax=rule.S.length?Math.max(...rule.S):-1;
      this.dieKind=new Uint8Array(9); for(let n=0;n<9;n++) this.dieKind[n]= n>sMax ? 4 : 3;
      const C=rule.C||2;
      if(this.pop||this.bx1>=0){ // стани, яких більше нема, гаснуть
        for(let y=Math.max(0,this.by0);y<=this.by1;y++) for(let x=Math.max(0,this.bx0);x<=this.bx1;x++){ const i=y*GN+x; if(this.cur[i]>=C) this.cur[i]=0; }
      }
      this.speeds=[8,32,128,512];
    } else this.speeds=[8,24,96,384];
    this.recount();
  }
  recount(){
    let p=0,x0=GN,y0=GN,x1=-1,y1=-1; const a=this.cur;
    if(this.bx1>=0) for(let y=this.by0;y<=this.by1;y++) for(let x=this.bx0;x<=this.bx1;x++){ const v=a[y*GN+x]; if(v){ if(v===1)p++; if(x<x0)x0=x; if(x>x1)x1=x; if(y<y0)y0=y; if(y>y1)y1=y; } }
    this.pop=p; this.bx0=x0; this.by0=y0; this.bx1=x1; this.by1=y1;
  }
  inside(x,y){ return x>=MARGIN&&y>=MARGIN&&x<GN-MARGIN&&y<GN-MARGIN; }
  get(x,y){ return this.inside(x,y)?this.cur[y*GN+x]:0; }
  setState(x,y,v,k,delay){
    if(!this.inside(x,y)) return;
    const i=y*GN+x, was=this.cur[i]; if(was===v) return;
    this.cur[i]=v;
    if(was===1) this.pop--; if(v===1) this.pop++;
    if(v){ if(x<this.bx0)this.bx0=x; if(x>this.bx1)this.bx1=x; if(y<this.by0)this.by0=y; if(y>this.by1)this.by1=y; }
    this.kind[i]= k || (v?9:5); this.tst[i]=NOW+(delay||0);
    if(!v) this.abox=grow(this.abox,x,y);
  }
  killAt(i,x,y,k){ if(this.cur[i]){ if(this.cur[i]===1)this.pop--; this.cur[i]=0; this.kind[i]=k; this.tst[i]=NOW; this.abox=grow(this.abox,x,y); } }
  placeCells(cells,ox,oy,v){ cells.forEach(c=>this.setState(ox+c[0],oy+c[1],c.length>2?c[2]:(v||1),9,0)); }

  step(){
    this.gen++;
    if(this.bx1<0){ this.fxTick(); return; }
    const N=GN, a=this.cur, b=this.nxt, K=this.kind, T=this.tst, now=NOW, wire=this.wire;
    const x0=Math.max(MARGIN,this.bx0-1), x1=Math.min(N-1-MARGIN,this.bx1+1);
    const y0=Math.max(MARGIN,this.by0-1), y1=Math.min(N-1-MARGIN,this.by1+1);
    const d=this.dNxt; if(d){ for(let y=d[1];y<=d[3];y++) b.fill(0,y*N+d[0],y*N+d[2]+1); }
    let nx0=N,ny0=N,nx1=-1,ny1=-1,p=0;
    if(wire){
      for(let y=y0;y<=y1;y++){ let i=y*N+x0;
        for(let x=x0;x<=x1;x++,i++){
          const s=a[i]; let v=0;
          if(s===1) v=2; else if(s===2) v=3;
          else if(s===3){ const n=(a[i-N-1]===1)+(a[i-N]===1)+(a[i-N+1]===1)+(a[i-1]===1)+(a[i+1]===1)+(a[i+N-1]===1)+(a[i+N]===1)+(a[i+N+1]===1); v=(n===1||n===2)?1:3; }
          b[i]=v; if(v){ if(v===1)p++; if(x<nx0)nx0=x; if(x>nx1)nx1=x; if(y<ny0)ny0=y; if(y>ny1)ny1=y; }
        } }
    } else {
      const Bm=this.Bm, Sm=this.Sm, C=this.rule.C||2, DK=this.dieKind;
      for(let y=y0;y<=y1;y++){ let i=y*N+x0;
        for(let x=x0;x<=x1;x++,i++){
          const s=a[i]; let v, n;
          if(C===2) n=a[i-N-1]+a[i-N]+a[i-N+1]+a[i-1]+a[i+1]+a[i+N-1]+a[i+N]+a[i+N+1];
          else if(s<2) n=(a[i-N-1]===1)+(a[i-N]===1)+(a[i-N+1]===1)+(a[i-1]===1)+(a[i+1]===1)+(a[i+N-1]===1)+(a[i+N]===1)+(a[i+N+1]===1);
          if(s===0){ v=Bm[n]; if(v){ K[i]=1; T[i]=now; } }
          else if(s===1){ if(Sm[n]) v=1; else { v=C>2?2:0; K[i]=DK[n]; T[i]=now; } }
          else v= s+1<C ? s+1 : 0;
          b[i]=v; if(v){ if(v===1)p++; if(x<nx0)nx0=x; if(x>nx1)nx1=x; if(y<ny0)ny0=y; if(y>ny1)ny1=y; }
        } }
    }
    this.abPrev=this.abox; this.abox=[x0,y0,x1,y1];
    this.cur=b; this.nxt=a;
    // nxt тепер старий буфер: він ненульовий лише там, де ми щойно читали — запам'ятати область для очистки
    this.dNxt=[Math.max(MARGIN,this.bx0),Math.max(MARGIN,this.by0),Math.min(N-1-MARGIN,this.bx1),Math.min(N-1-MARGIN,this.by1)];
    this.bx0=nx0; this.by0=ny0; this.bx1=nx1; this.by1=ny1; this.pop=p;
    this.fxTick();
  }

  /* ── ефекти: та сама математика ──
     Вибух: квадратна хвиля зі швидкістю світла c (1 клітина/такт) — у сусідстві Мура світловий конус квадратний.
     Антиматерія: автомат-пожежа в околі Мура; іскра гасне за 5 тактів, пляма — за 48. */
  fxActive(){ return this.explos.length>0||this.aBox!==null; }
  fxTick(){
    const N=GN;
    for(const e of this.explos){
      e.r++; const r=Math.min(e.r,e.R);
      for(let y=e.y-r;y<=e.y+r;y++) for(let x=e.x-r;x<=e.x+r;x++) if(this.inside(x,y)) this.killAt(y*N+x,x,y,6);
      if(e.r>=e.R){ this.debris(e); e.done=true; }
    }
    if(this.explos.length) this.explos=this.explos.filter(e=>!e.done);
    if(!this.aBox) return;
    const A=this.anti, a=this.cur, [x0,y0,x1,y1]=this.aBox, burn=[];
    for(let y=y0;y<=y1;y++) for(let x=x0;x<=x1;x++){
      const i=y*N+x; if(!A[i]) continue;
      if(a[i]) this.killAt(i,x,y,7);
      for(let dy=-1;dy<=1;dy++) for(let dx=-1;dx<=1;dx++){ const j=i+dy*N+dx; if(a[j]===1&&!A[j]) burn.push(j); }
    }
    let nb=null;
    for(let y=y0;y<=y1;y++) for(let x=x0;x<=x1;x++){ const i=y*N+x; if(A[i]){ A[i]--; if(A[i]) nb=grow(nb,x,y); } }
    for(const j of burn){ if(A[j]) continue; const x=j%N, y=(j/N)|0; this.killAt(j,x,y,7); A[j]=ANTI_FIRE; nb=grow(nb,x,y); }
    this.aBox=nb;
  }
  debris(e){
    const R=e.R+2, cx=e.x, cy=e.y;
    for(const [sx,sy] of [[1,1],[-1,1],[1,-1],[-1,-1]]) G_SE.forEach(([gx,gy])=>this.setState(cx+sx*(R+gx),cy+sy*(R+gy),1,9,0));
    LWSS_E.forEach(([lx,ly])=>{
      this.setState(cx+R+lx,cy+ly-2,1,9,0); this.setState(cx-R-lx,cy+ly-2,1,9,0);
      this.setState(cx+ly-2,cy+R+lx,1,9,0); this.setState(cx+ly-2,cy-R-lx,1,9,0);
    });
    const r=Math.max(2,e.R-5);
    for(let k=-r;k<=r;k++) for(const [x,y] of [[cx+k,cy-r],[cx+k,cy+r],[cx-r,cy+k],[cx+r,cy+k]])
      if(Math.random()<.22) this.setState(x,y,1,9,Math.abs(k)*8);
  }
  paintAnti(x,y){
    if(!this.inside(x,y)) return; const i=y*GN+x;
    if(this.anti[i]<ANTI_PAINT) this.anti[i]=ANTI_PAINT; this.aBox=grow(this.aBox,x,y); this.killAt(i,x,y,7);
  }

  /* ── інструменти ── */
  get tools(){ return this.wire ? ['hand','wire','spark','stamp','eraser'] : ['hand','brush','stamp','soup','eraser','bomb','anti']; }
  apply(tool,x,y,first,o){
    const r=o.size;
    switch(tool){
      case 'brush': for(let dy=-r;dy<=r;dy++)for(let dx=-r;dx<=r;dx++) this.setState(x+dx,y+dy,1,9,(Math.abs(dx)+Math.abs(dy))*25); break;
      case 'wire': if(this.get(x,y)===0) this.setState(x,y,3,9,0); break;
      case 'spark':
        if(first){ if(this.get(x,y)) { this.setState(x,y,1,9,0); o.last=[x,y]; } else o.last=null; }
        else if(o.last && (x!==o.last[0]||y!==o.last[1]) && this.get(x,y)===3){ this.setState(o.last[0],o.last[1],2,9,0); this.setState(x,y,1,9,0); o.last=null; }
        break;
      case 'eraser': for(let dy=-r;dy<=r;dy++)for(let dx=-r;dx<=r;dx++){ const X=x+dx,Y=y+dy; if(this.inside(X,Y)) this.killAt(Y*GN+X,X,Y,5); } break;
      case 'anti': if(!this.wire) for(let dy=-r;dy<=r;dy++)for(let dx=-r;dx<=r;dx++) this.paintAnti(x+dx,y+dy); break;
      case 'bomb': if(first&&this.inside(x,y)) this.explos.push({x,y,r:0,R:o.bombR}); break;
      case 'soup': if(first){ const h=o.soup>>1;
          for(let dy=-h;dy<h;dy++)for(let dx=-h;dx<h;dx++) if(Math.random()<.37) this.setState(x+dx,y+dy,1,9,Math.max(Math.abs(dx),Math.abs(dy))*30); }
        break;
      case 'stamp': if(first) this.stamp(o.stampCells,x,y,o.rot); break;
    }
  }
  stamp(cells,cx,cy,rot){
    let w=0,h=0; cells.forEach(c=>{ if(c[0]>w)w=c[0]; if(c[1]>h)h=c[1]; });
    cells.forEach(c=>{
      let dx=c[0]-Math.floor(w/2), dy=c[1]-Math.floor(h/2);
      for(let k=0;k<rot;k++){ const t=dx; dx=-dy; dy=t; }
      this.setState(cx+dx,cy+dy,c.length>2?c[2]:1,9,Math.max(Math.abs(dx),Math.abs(dy))*38); // хвиля кільцями Мура
    });
  }
  clear(){ this.reset(); }

  /* ── історія ── */
  snapshot(){
    if(this.bx1<0) return {empty:true,gen:this.gen};
    const [x0,y0,x1,y1]=[this.bx0,this.by0,this.bx1,this.by1], w=x1-x0+1, data=new Uint8Array(w*(y1-y0+1));
    for(let y=y0;y<=y1;y++) data.set(this.cur.subarray(y*GN+x0,y*GN+x1+1),(y-y0)*w);
    return {box:[x0,y0,x1,y1],data,gen:this.gen};
  }
  restore(s){
    this.cur.fill(0); this.nxt.fill(0); this.kind.fill(0); this.anti.fill(0);
    this.dNxt=null; this.explos=[]; this.aBox=null; this.abox=this.abPrev=null; this.gen=s.gen;
    if(s.empty){ this.bx0=this.by0=GN; this.bx1=this.by1=-1; this.pop=0; return; }
    const [x0,y0,x1,y1]=s.box, w=x1-x0+1;
    for(let y=y0;y<=y1;y++) this.cur.set(s.data.subarray((y-y0)*w,(y-y0+1)*w),y*GN+x0);
    this.bx0=x0; this.by0=y0; this.bx1=x1; this.by1=y1; this.recount();
  }

  /* ── відображення ── */
  readouts(){ return this.wire ? [[this.gen,'тактів'],[this.pop,'електронів']] : [[this.gen,'покоління'],[this.pop,'живих клітин']]; }
  spark(){ return this.pop; }
  fitBox(){ return this.bx1>=0 ? [this.bx0-6,this.by0-6,this.bx1+7,this.by1+7] : [GC-20,GC-28,GC+20,GC+28]; }
  get zoomLim(){ return [.25,60]; }
  animated(){ return true; }

  draw(ctx,v){
    const {s,toSX,toSY,vx0,vy0,vx1,vy1,dur}=v, t=NOW, N=GN;
    // межа світу
    ctx.strokeStyle=COL.line; ctx.lineWidth=1;
    ctx.strokeRect(toSX(MARGIN)-.5,toSY(MARGIN)-.5,(N-2*MARGIN)*s,(N-2*MARGIN)*s);
    let x0=this.bx0,y0=this.by0,x1=this.bx1,y1=this.by1;
    if(dur){ for(const b of [this.abox,this.abPrev]) if(b){ x0=Math.min(x0,b[0]); y0=Math.min(y0,b[1]); x1=Math.max(x1,b[2]); y1=Math.max(y1,b[3]); } }
    x0=Math.max(vx0,x0,0); y0=Math.max(vy0,y0,0); x1=Math.min(vx1,x1,N-1); y1=Math.min(vy1,y1,N-1);
    if(x0<=x1&&y0<=y1) this.drawCells(ctx,v,x0,y0,x1,y1,t);
    this.drawFx(ctx,v);
  }
  drawCells(ctx,v,x0,y0,x1,y1,t){
    const {s,toSX,toSY,dur}=v, a=this.cur, K=this.kind, T=this.tst, N=GN;
    const gap=s>=6?Math.max(1,s*.08):0, sz=Math.max(s-gap,.75), r=s>=10?Math.min(s*.22,4):0;
    const C=this.wire?4:(this.rule.C||2);
    const paths=[]; for(let k=0;k<Math.max(C,4);k++) paths.push(new Path2D());
    const anim=[];
    const add=(p,x,y)=>{ const X=toSX(x)+gap/2, Y=toSY(y)+gap/2; if(r) p.roundRect(X,Y,sz,sz,r); else p.rect(X,Y,sz,sz); };
    for(let y=y0;y<=y1;y++){ let i=y*N+x0;
      for(let x=x0;x<=x1;x++,i++){
        const st=a[i];
        if(st){
          if(dur&&st===1){ const k=K[i]; if(k===1||k===9){ const age=t-T[i]; if(age<0) continue; if(age<dur){ anim.push(i,x,y); continue; } } }
          add(paths[st],x,y);
        } else if(dur){
          const k=K[i]; if(k<3||k===9) continue;
          const age=t-T[i], d=(k>=6?2.2:1)*dur; if(age>=0&&age<d) anim.push(i,x,y);
        }
      } }
    if(this.wire){
      ctx.globalAlpha=.55; ctx.fillStyle=COL.amber; ctx.fill(paths[3]);
      ctx.globalAlpha=1; ctx.fillStyle=COL.danger; ctx.fill(paths[2]);
      ctx.fillStyle=COL.info; ctx.fill(paths[1]);
    } else {
      ctx.fillStyle=COL.ink; ctx.fill(paths[1]);
      // Generations: стани загасання — це і є анімація, задана правилом
      for(let st=2;st<C;st++){ ctx.globalAlpha=.75*(1-(st-1)/(C-1))+.1; ctx.fillStyle=st===2?COL.c1:COL.muted; ctx.fill(paths[st]); }
      ctx.globalAlpha=1;
    }
    for(let n=0;n<anim.length;n+=3){
      const i=anim[n], x=anim[n+1], y=anim[n+2], k=K[i];
      const d=(k>=6&&k!==9?2.2:1)*dur, p=Math.min(1,(t-T[i])/d);
      let sc=1, al=1, col=COL.ink;
      switch(k){
        case 1: case 9: sc=.15+.85*easeSpring(p); col=p<.55?COL.clay:(this.wire?COL.amber:COL.ink); break;
        case 3: sc=1-.7*p; al=1-p; col=COL.muted; break;
        case 4: sc=1+.3*Math.sin(p*Math.PI); al=1-p*p; col=COL.danger; break;
        case 5: sc=1-p; al=1-p; col=COL.muted; break;
        case 6: sc=1+.8*p; al=(1-p)*(1-p); col=COL.danger; break;
        case 7: sc=1-.4*p; al=1-p; col=COL.danger; break;
      }
      if(a[i]>1&&(k===1||k===9)) col=a[i]===3?COL.amber:col;
      const w=Math.max(sz*sc,.5), X=toSX(x)+s/2-w/2, Y=toSY(y)+s/2-w/2;
      ctx.globalAlpha=Math.max(0,al); ctx.fillStyle=col; ctx.beginPath();
      if(r) ctx.roundRect(X,Y,w,w,Math.min(r*sc,w/2)); else ctx.rect(X,Y,w,w);
      ctx.fill();
    }
    ctx.globalAlpha=1;
  }
  drawFx(ctx,v){
    const {s,toSX,toSY,vx0,vy0,vx1,vy1}=v, N=GN;
    if(this.aBox){
      const b=this.aBox, x0=Math.max(vx0,b[0]),x1=Math.min(vx1,b[2]),y0=Math.max(vy0,b[1]),y1=Math.min(vy1,b[3]);
      ctx.fillStyle=COL.danger;
      for(let y=y0;y<=y1;y++) for(let x=x0;x<=x1;x++){
        const a=this.anti[y*N+x]; if(!a) continue;
        ctx.globalAlpha= a>ANTI_FIRE ? .14+.1*(a/ANTI_PAINT) : .25+.6*(a/ANTI_FIRE);
        ctx.fillRect(toSX(x),toSY(y),Math.max(s,1),Math.max(s,1));
      }
      ctx.globalAlpha=1;
    }
    for(const e of this.explos){
      const r=Math.min(e.r,e.R), X=toSX(e.x-r), Y=toSY(e.y-r), w=(2*r+1)*s;
      ctx.fillStyle=COL.danger; ctx.globalAlpha=.07; ctx.fillRect(X,Y,w,w);
      ctx.globalAlpha=.9*(1-r/(e.R+2)); ctx.strokeStyle=COL.danger; ctx.lineWidth=Math.max(1.5,s*.9);
      ctx.strokeRect(X,Y,w,w); ctx.globalAlpha=1;
    }
  }
}
const easeSpring=p=>{ const c=1.7; p=p-1; return 1+p*p*((c+1)*p+c); };

/* ───────── мураха Ленгтона / турміти ─────────
   правило — рядок L/R: на клітині кольору c мураха повертає за rule[c], перефарбовує в (c+1) mod n і робить крок */
const AN=512;
class AntWorld extends World{
  constructor(rule){ super(); this.g=new Uint8Array(AN*AN); this.type='ant'; this.rule=rule||'RL'; this.reset(); this.speeds=[30,240,2000,12000]; }
  reset(){ this.g.fill(0); this.ants=[]; this.gen=0; this.painted=0; this.box=null; this.acc=0; }
  setRule(r){ this.rule=r; const m=r.length; for(let i=0;i<this.g.length;i++) if(this.g[i]>=m){ this.g[i]=0; } this.recount(); }
  recount(){ let p=0; for(const v of this.g) if(v) p++; this.painted=p; }
  addAnt(x,y,d){ x=((x%AN)+AN)%AN; y=((y%AN)+AN)%AN; this.ants.push({x,y,d:d||0}); this.box=grow(this.box,x,y); }
  advance(dt,ix){ // багато кроків за раз — без бюджету на кожен
    this.acc+=dt*this.speeds[ix]; let n=Math.floor(this.acc); this.acc-=n;
    const t0=performance.now();
    while(n>0){ const k=Math.min(n,2000); for(let j=0;j<k;j++) this.step(); n-=k; if(performance.now()-t0>12) break; }
  }
  step(){
    const g=this.g, R=this.rule, m=R.length;
    for(const a of this.ants){
      const i=a.y*AN+a.x, c=g[i];
      a.d=(a.d+(R.charCodeAt(c)===82?1:3))&3;          // 'R' = 82
      const nc=(c+1)%m; g[i]=nc; if(!c&&nc) this.painted++; else if(c&&!nc) this.painted--;
      if(a.d===0) a.y=(a.y+AN-1)%AN; else if(a.d===1) a.x=(a.x+1)%AN; else if(a.d===2) a.y=(a.y+1)%AN; else a.x=(a.x+AN-1)%AN;

// Макроклітинний формат Golly ([M2]), два стани
function loadMC(hl,text){
  const nodes=[0];const lines=text.split(/\r?\n/);
  for(const line of lines){
    if(!line||line[0]==='['||line[0]==='#')continue;
    const ch=line[0];
    if(ch==='.'||ch==='*'||ch==='$'){
      const bits=[];let x=0,y=0;
      for(const c of line){if(c==='.')x++;else if(c==='*'){bits.push(x+','+y);x++;}else if(c==='$'){y++;x=0;}}
      const set=new Set(bits);
      nodes.push(hl.fromBits((xx,yy)=>set.has(xx+','+yy)?1:0,0,0,8));
    } else {
      const p=line.trim().split(/\s+/).map(Number);if(p.length<5)continue;
      const L=p[0];const g=k=>k===0?hl.empty(L-1):nodes[k];
      nodes.push(hl.join(g(p[1]),g(p[2]),g(p[3]),g(p[4])));
    }
  }
  return nodes[nodes.length-1];
}

/* ───────── 3D: клітинний автомат у кубі N³ ─────────
   Сусідство Мура — 26 сусідів (куб 3×3×3), фон Неймана — 6 граней.
   Сума по кубу рахується трьома проходами (x, потім y, потім z) — це ~4 операції на клітину замість 26. */
const range=(a,b)=>Array.from({length:b-a+1},(_,i)=>a+i);
const R3_PRESETS=[
  {n:'Піро',       B:[6,7,8],S:[4,5,6,7],C:10,nb:'M', seed:{s:16,d:.3},  d:'Спалахи з довгими слідами: 10 станів, клітина тліє 8 тактів.'},
  {n:'Кристал',    B:[1,3],S:range(0,6),C:2,nb:'VN', seed:'one',        d:'Сусідство фон Неймана (лише 6 граней). З однієї клітини росте кристал.'},
  {n:'Хмари',      B:[13,14,17,18,19],S:range(13,26),C:2,nb:'M', seed:{s:24,d:.55}, d:'Густий розсип конденсується в стійкі хмари. Рідкий — розвіюється.'},
  {n:'Будівельник',B:[4,6,8,9],S:[2,6,9],C:10,nb:'M', seed:{s:16,d:.25}, d:'Повільно будує й руйнує ажурні каркаси.'},
  {n:'Амеба',      B:[5,6,7,12,13,15],S:range(9,26),C:5,nb:'M', seed:{s:16,d:.3}, d:'Розростається, поки не заповнить куб.'},
  {n:'Архітектура',B:[3],S:[4,5,6],C:2,nb:'M', seed:{s:24,d:.25}, d:'Розсип застигає в стійкі «будівлі».'},
  {n:'Корали',     B:[5,6,7,8],S:[5,6,7,8],C:2,nb:'M', seed:{s:24,d:.35}, d:'Наростає щільними рифами.'},
  {n:'678',        B:[6,7,8],S:[6,7,8],C:3,nb:'M', seed:{s:24,d:.4},  d:'Пульсує й росте, з коротким загасанням.'},
  {n:'Бейз 4555',  B:[5],S:[4,5],C:2,nb:'M', seed:{s:16,d:.2},  d:'3D-«Життя» Картера Бейза (1987). З випадкового розсипу майже все гине: тут живуть лише особливі фігури.'},
];
const rule3Str=r=>'B'+r.B.join(',')+'/S'+r.S.join(',')+(r.C>2?'/'+r.C:'')+(r.nb==='VN'?' · VN':'');
const shortRule3=r=>{ const comp=a=>{ const o=[]; for(let i=0;i<a.length;){ let j=i; while(j+1<a.length&&a[j+1]===a[j]+1) j++; o.push(j-i>=2?a[i]+'–'+a[j]:a.slice(i,j+1).join(',')); i=j+1; } return o.join(','); };
  return 'B'+comp(r.B)+'/S'+comp(r.S)+(r.C>2?'/'+r.C:''); };

class Life3D extends World{
  constructor(N,rule){ super(); this.type='3d'; this.alloc(N||48); this.setRule(rule||R3_PRESETS[0]); }
  alloc(N){

  }
  setRule(r){
    this.rule={B:[...r.B],S:[...r.S],C:r.C||2,nb:r.nb||'M'};
    this.Bm=new Uint8Array(27); this.Sm=new Uint8Array(27);
    this.rule.B.forEach(k=>this.Bm[k]=1); this.rule.S.forEach(k=>this.Sm[k]=1);
    const sMax=this.rule.S.length?Math.max(...this.rule.S):-1;
    this.dieKind=new Uint8Array(27); for(let k=0;k<27;k++) this.dieKind[k]=k>sMax?4:3;
    const C=this.rule.C; for(let i=0;i<this.s.length;i++) if(this.s[i]>=C) this.s[i]=0;

  }
  recount(){ let p=0; for(const v of this.s) if(v===1) p++; this.pop=p; }

  inside(x,y,z){ const N=this.N; return x>=0&&y>=0&&z>=0&&x<N&&y<N&&z<N; }

    this.s[i]=v; if(was===1) this.pop--; if(v===1) this.pop++;

      for(let i=0;i<n;i++){ const y=((i/N)|0)%N; t2[i]=t1[i]+(y>0?t1[i-N]:0)+(y<N-1?t1[i+N]:0); }

    } else {
      for(let i=0;i<n;i++){ const x=i%N, y=((i/N)|0)%N, z=(i/NN)|0;
        t1[i]=(x>0?a[i-1]:0)+(x<N-1?a[i+1]:0)+(y>0?a[i-N]:0)+(y<N-1?a[i+N]:0)+(z>0?a[i-NN]:0)+(z<N-1?a[i+NN]:0); }
    }
    cnt=t1;
    const nx=this.nx; let p=0;

      const st=s[i], k=cnt[i]; let v;

      else if(st===1){ if(Sm[k]) v=1; else { v=C>2?2:0; K[i]=DK[k]; T[i]=now; } }
      else v=st+1<C?st+1:0;

    this.fxTick();
  }
  /* ефекти: вибух — кубічна хвиля зі швидкістю світла c; у сусідстві Мура світловий конус у 3D — куб */
  fxActive(){ return this.explos.length>0; }
  fxTick(){
    for(const e of this.explos){
      e.r++; const r=Math.min(e.r,e.R);
      for(let z=e.z-r;z<=e.z+r;z++) for(let y=e.y-r;y<=e.y+r;y++) for(let x=e.x-r;x<=e.x+r;x++){
        if(!this.inside(x,y,z)) continue; const i=this.idx(x,y,z);
        if(this.s[i]){ if(this.s[i]===1) this.pop--; this.s[i]=0; this.kind[i]=6; this.tst[i]=NOW; this.lastChange=NOW; this.dirty=true; } }
      if(e.r>=e.R){ // попіл на оболонці — далі живе за правилом
        const R=e.R; for(let z=-R;z<=R;z++) for(let y=-R;y<=R;y++) for(let x=-R;x<=R;x++)
          if(Math.max(Math.abs(x),Math.abs(y),Math.abs(z))===R && Math.random()<.18) this.setState(e.x+x,e.y+y,e.z+z,1,9,0);
        e.done=true; }
    }
    if(this.explos.length) this.explos=this.explos.filter(e=>!e.done);
  }
  soup(cx,cy,cz,size,d){
    const h=size>>1;
    for(let z=-h;z<h;z++) for(let y=-h;y<h;y++) for(let x=-h;x<h;x++) if(Math.random()<d) this.setState(cx+x,cy+y,cz+z,1,9,Math.max(Math.abs(x),Math.abs(y),Math.abs(z))*22);
  }
  seed(sd){
    const c=this.N>>1;
    if(sd==='one') this.setState(c,c,c,1,9,0);
    else this.soup(c,c,c,Math.min(sd.s,this.N-2),sd.d);
  }
  clear(){ this.s.fill(0); this.kind.fill(0); this.pop=0; this.gen=0; this.explos=[]; this.dirty=true; }
  snapshot(){ return {s:this.s.slice(),gen:this.gen,N:this.N}; }
  restore(sn){ if(sn.N!==this.N) return; this.s.set(sn.s); this.kind.fill(0); this.gen=sn.gen; this.explos=[]; this.recount(); this.dirty=true; }
  readouts(){ return [[this.gen,'покоління'],[this.pop,'живих клітин']]; }
  spark(){ return this.pop; }
}

        M[o+12]=x-h; M[o+13]=y-h; M[o+14]=z-h; M[o+15]=1;
        CC[k*3]=r/255; CC[k*3+1]=g/255; CC[k*3+2]=b/255; IC_[k]=i; k++;

  updateCut(){

  }

      if(p.axis===1){ m.rotation.y=Math.PI/2; m.position.x=off; } else if(p.axis===2){ m.rotation.x=-Math.PI/2; m.position.y=off; } else m.position.z=off; }
  }
  render(dur){ if(!this.ok||!this.w) return; this.rebuild(dur); this.updateShells(); this.updatePen(); this.updateCamera(); this.renderer.render(this.scene,this.camera); }
  /* клітина на площині пензля під пальцем */
  pickPlane(px,py,axis,pos){
    const ndc=new THREE.Vector2(px/this.W*2-1,-(py/this.H)*2+1); this.ray.setFromCamera(ndc,this.camera);
    const h=this.N/2-.5, nrm=axis===1?[1,0,0]:axis===3?[0,0,1]:[0,1,0];
    const plane=new THREE.Plane(new THREE.Vector3(...nrm),-(pos-h)), pt=new THREE.Vector3();
    if(!this.ray.ray.intersectPlane(plane,pt)) return null;
    const cell=[Math.round(pt.x+h),Math.round(pt.y+h),Math.round(pt.z+h)]; cell[axis-1]=pos;
    return this.w.inside(...cell)?cell:null;
  }
  /* куди влучив палець: клітина + нормаль грані; якщо в порожнечу — площина розрізу або середня горизонталь */
  pick(px,py){
    const ndc=new THREE.Vector2(px/this.W*2-1,-(py/this.H)*2+1); this.ray.setFromCamera(ndc,this.camera);
    const N=this.N, h=N/2-.5, w=this.w;
    const hits=this.ray.intersectObject(this.mesh);
    for(const hit of hits){ const i=this.instCell[hit.instanceId]; if(i==null||!w.s[i]) continue;
      const x=i%N, y=((i/N)|0)%N, z=(i/(N*N))|0, n=hit.face.normal; return {cell:[x,y,z],normal:[Math.round(n.x),Math.round(n.y),Math.round(n.z)]}; }
    const c=this.cut, nrm=c.axis===1?[1,0,0]:c.axis===3?[0,0,1]:[0,1,0];
    const off=c.axis?c.pos-h:0;
    const plane=new THREE.Plane(new THREE.Vector3(...nrm),-off), pt=new THREE.Vector3();
    if(!this.ray.ray.intersectPlane(plane,pt)) return null;
    const cell=[Math.round(pt.x+h),Math.round(pt.y+h),Math.round(pt.z+h)];
    if(!w.inside(...cell)) return null; return {cell,normal:[0,0,0],empty:true};
  }
}

/* ── мініатюри ── */
function drawThumb(cv,item){
  const D=Math.min(devicePixelRatio||1,3), S=56; cv.width=S*D; cv.height=S*D;
  const c=cv.getContext('2d'); c.setTransform(D,0,0,D,0,0); c.clearRect(0,0,S,S);
  const cellsFit=(cells,colorOf)=>{
    let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9; cells.forEach(([x,y])=>{ x0=Math.min(x0,x);y0=Math.min(y0,y);x1=Math.max(x1,x);y1=Math.max(y1,y); });
    const w=x1-x0+1,h=y1-y0+1,sc=Math.min((S-12)/w,(S-12)/h,10),ox=(S-w*sc)/2,oy=(S-h*sc)/2,g=sc>=4?1:0;
    cells.forEach(cl=>{ c.fillStyle=colorOf?colorOf(cl):COL.ink; c.fillRect(ox+(cl[0]-x0)*sc+g/2,oy+(cl[1]-y0)*sc+g/2,Math.max(sc-g,.8),Math.max(sc-g,.8)); });
  };
  if(item.id==='rules'){
    const on=[[0,0],[2,0],[1,1],[0,2]]; for(let y=0;y<3;y++)for(let x=0;x<3;x++){ c.fillStyle=on.some(([a,b])=>a===x&&b===y)?COL.ink:COL.s3; c.beginPath(); c.roundRect(8+x*14,8+y*14,12,12,3); c.fill(); }
    return;
  }
  if(item.thumb){ cellsFit(item.thumb); return; }
  const f=item.thumbFn;
  if(f==='wire'){ cellsFit(WW_CLOCK.concat(WW_DIODE.map(([x,y,s])=>[x+12,y,s])),cl=>cl[2]===1?COL.info:cl[2]===2?COL.danger:COL.amber); return; }
  if(f==='brain'){ // невеличкий справжній прогін
    const n=40, a=new Uint8Array(n*n); let rs=7; const rnd=()=>((rs=(rs*1664525+1013904223)>>>0)/4294967296);
    for(let y=14;y<26;y++)for(let x=14;x<26;x++) if(rnd()<.35) a[y*n+x]=1;
    for(let t=0;t<14;t++){ const b=new Uint8Array(n*n); for(let y=1;y<n-1;y++)for(let x=1;x<n-1;x++){ const i=y*n+x, s=a[i];
      if(s===1) b[i]=2; else if(s===0){ let k=0; for(let dy=-1;dy<=1;dy++)for(let dx=-1;dx<=1;dx++) if((dx||dy)&&a[i+dy*n+dx]===1)k++; if(k===2)b[i]=1; } } a.set(b); }
    const cl=[]; for(let y=0;y<n;y++)for(let x=0;x<n;x++) if(a[y*n+x]) cl.push([x,y,a[y*n+x]]);
    if(cl.length) cellsFit(cl,q=>q[2]===1?COL.ink:COL.c1); return;
  }
  if(f==='ant'){
    const n=96, g=new Uint8Array(n*n); let x=48,y=48,d=0;
    for(let t=0;t<11500;t++){ const i=y*n+x; d=(d+(g[i]?3:1))&3; g[i]^=1; if(d===0)y--; else if(d===1)x++; else if(d===2)y++; else x--; if(x<0||y<0||x>=n||y>=n) break; }
    const cl=[]; for(let yy=0;yy<n;yy++)for(let xx=0;xx<n;xx++) if(g[yy*n+xx]) cl.push([xx,yy]); cellsFit(cl); return;
  }
  if(f==='w30'||f==='w110'){
    const R=f==='w30'?30:110, W=57, H=56; let row=new Uint8Array(W); if(R===30) row[28]=1; else row[W-6]=1;
    c.fillStyle=COL.ink;
    for(let yy=0;yy<H;yy++){ for(let xx=0;xx<W;xx++) if(row[xx]) c.fillRect(xx,yy,1,1);
      const nr=new Uint8Array(W); for(let xx=0;xx<W;xx++){ const l=row[(xx+W-1)%W],m=row[xx],r=row[(xx+1)%W]; nr[xx]=(R>>((l<<2)|(m<<1)|r))&1; } row=nr; }
    return;
  }
  if(f==='lenia'){
    const m=decodeLenia(LENIA_ANIMALS[0].c), h=m.length, w=Math.max(...m.map(r=>r.length)), sc=Math.min((S-8)/w,(S-8)/h);
    const a=COL.rgb.c1, b=COL.rgb.ink;
    m.forEach((r,y)=>r.forEach((v,x)=>{ if(v<=0) return; c.fillStyle=`rgba(${a[0]+(b[0]-a[0])*v|0},${a[1]+(b[1]-a[1])*v|0},${a[2]+(b[2]-a[2])*v|0},${Math.pow(v,.7)})`;
      c.fillRect((S-w*sc)/2+x*sc,(S-h*sc)/2+y*sc,sc+.3,sc+.3); }));
  }
}

/* ───── камера ───── */
function fitTo(cam,box){
  const [x0,y0,x1,y1]=box; if(!W||!H) return;
  cam.x=(x0+x1)/2; cam.y=(y0+y1)/2;
  const lim=A().world?A().world.zoomLim:[.25,60];
  cam.s=clamp(Math.min(W/(x1-x0),H/(y1-y0))*.94,lim[0],lim[1]);
}
function fit(){ const a=A(); if(!a.world) return; fitTo(a.cam,(screen==='exhibit'&&a.item.view)||a.world.fitBox()); }
function zoomAt(px,py,k){
  const a=A(), cam=a.cam, lim=a.world.zoomLim;
  const ns=clamp(cam.s*k,lim[0],lim[1]); k=ns/cam.s;
  cam.x+=(px-W/2)/cam.s*(1-1/k); cam.y+=(py-H/2)/cam.s*(1-1/k); cam.s=ns;
}
const toCell=(cam,px,py)=>[Math.floor(cam.x+(px-W/2)/cam.s),Math.floor(cam.y+(py-H/2)/cam.s)];

/* ───── малювання ───── */
function animDur(w){
  if(REDUCED.matches||A().cam.s<2.5||!w.animated()) return 0;
  if(!running) return 260;
  const r=w.speeds[speedIx]; if(r>=128) return 0;
  return clamp(1500/r,120,300);
}
function draw(){
  const a=A(), w=a.world, cam=a.cam, s=cam.s;
  ctx.setTransform(DPR,0,0,DPR,0,0); ctx.clearRect(0,0,W,H);
  if(!w) return;
  const toSX=x=>(x-cam.x)*s+W/2, toSY=y=>(y-cam.y)*s+H/2;
  const v={s,cam,DPR,toSX,toSY,vx0:Math.floor(cam.x-W/2/s),vx1:Math.ceil(cam.x+W/2/s),vy0:Math.floor(cam.y-H/2/s),vy1:Math.ceil(cam.y+H/2/s),dur:animDur(w)};
  // сітка
  if(s>=8&&w.type!=='meta'&&w.type!=='wolf'&&w.type!=='lenia'){
    ctx.strokeStyle=COL.line; ctx.lineWidth=1; ctx.globalAlpha=Math.min(1,(s-8)/10)*.8; ctx.beginPath();
    for(let x=v.vx0;x<=v.vx1;x++){ const X=Math.round(toSX(x))+.5; ctx.moveTo(X,0); ctx.lineTo(X,H); }
    for(let y=v.vy0;y<=v.vy1;y++){ const Y=Math.round(toSY(y))+.5; ctx.moveTo(0,Y); ctx.lineTo(W,Y); }
    ctx.stroke(); ctx.globalAlpha=1;
  }
  w.draw(ctx,v);
  // порожній стан пропонує наступний крок
  if(screen==='sandbox'&&w.type==='grid'&&w.bx1<0&&!w.fxActive()){
    ctx.fillStyle=COL.muted; ctx.textAlign='center'; ctx.font='500 15px Onest, sans-serif';
    ctx.fillText('Тут поки пусто',W/2,H/2-10); ctx.font='400 13px Onest, sans-serif';
    ctx.fillText(w.wire?'Намалюй провід і пусти електрон':'Малюй пальцем або постав штамп',W/2,H/2+12); ctx.textAlign='start';
  }
  // осі симетрії
  if(screen==='sandbox'&&sand.opt.sym&&symTool()){
    ctx.save(); ctx.setLineDash([4,5]); ctx.strokeStyle=COL.muted; ctx.globalAlpha=.6; ctx.lineWidth=1; ctx.beginPath();
    const c=symCenter(); const X=Math.round(toSX(c[0]))+.5, Y=Math.round(toSY(c[1]))+.5;
    ctx.moveTo(X,0); ctx.lineTo(X,H); if(sand.opt.sym===2){ ctx.moveTo(0,Y); ctx.lineTo(W,Y); } ctx.stroke(); ctx.restore();
  }
  // зона виходу вентиля
  if(screen==='exhibit'&&ex.item.gate){
    const [ox,oy]=GATE_O, z=OUT_ZONE, zx=toSX(ox+z[0]), zy=toSY(oy+z[1]);
    ctx.setLineDash([5,4]); ctx.lineWidth=1.5; ctx.strokeStyle=COL.info; ctx.strokeRect(zx,zy,(z[2]-z[0])*s,(z[3]-z[1])*s); ctx.setLineDash([]);
    ctx.fillStyle=COL.info; ctx.font='500 12px Onest, sans-serif'; ctx.fillText('вихід',zx+6,zy+16);
    ctx.fillStyle=COL.muted; if(ex.opt.gateA) ctx.fillText('A',toSX(ox+10)-2,toSY(oy+8)); ctx.fillText('B',toSX(ox+100)+6,toSY(oy+8));
  }
}

const sparkCv=$('spark'), sctx=sparkCv.getContext('2d');
let lastSpark=0;
function updateReadouts(){
  const a=A(), w=a.world; if(!w) return;
  const r=w.readouts(); $('r1v').textContent=fmt(r[0][0]); $('r1l').textContent=r[0][1]; $('r2v').textContent=fmt(r[1][0]); $('r2l').textContent=r[1][1];
  sparkCv.classList.toggle('hidden',w.type==='meta');
  if(screen==='exhibit') updateExhibitStatus();
}
function recordSpark(m){ if(!m.world||m.world.type==='meta') return; if(NOW-(m.lastSpark||0)<90) return; m.lastSpark=NOW; m.spark.push(m.world.spark()); if(m.spark.length>90) m.spark.shift(); }
function pushSpark(force){
  const a=A(); if(!a.world||a.world.type==='meta') return;
  if(!force&&NOW-lastSpark<90) return; lastSpark=NOW; a.lastSpark=NOW;
  a.spark.push(a.world.spark()); if(a.spark.length>90) a.spark.shift();
  const d=a.spark, Wd=sparkCv.width, Hd=sparkCv.height; sctx.clearRect(0,0,Wd,Hd);
  if(d.length<2) return;
  let mn=Infinity,mx=-Infinity; for(const v of d){ if(v<mn)mn=v; if(v>mx)mx=v; } if(mx-mn<1e-9){ mx+=1; mn-=1; }
  sctx.strokeStyle=COL.muted; sctx.lineWidth=2.5; sctx.lineJoin='round'; sctx.beginPath();
  d.forEach((v,i)=>{ const x=3+(Wd-6)*i/89, y=Hd-4-(Hd-8)*(v-mn)/(mx-mn); i?sctx.lineTo(x,y):sctx.moveTo(x,y); }); sctx.stroke();
  const lx=3+(Wd-6)*(d.length-1)/89, ly=Hd-4-(Hd-8)*(d[d.length-1]-mn)/(mx-mn);
  sctx.fillStyle=COL.ink; sctx.beginPath(); sctx.arc(lx,ly,3.5,0,6.283); sctx.fill();
}

const symTool=()=>['brush','anti','eraser','wire'].includes(sand.tool)&&sand.world.type==='grid';
function symCenter(){ return sand.symC||[Math.round(sand.cam.x),Math.round(sand.cam.y)]; }

function buildDock(){

  dock.innerHTML=w.tools.map((t,i)=>`<button class="tool" role="radio" data-t="${t}" aria-checked="${t===sand.tool}" aria-label="${toolName(t,w)}" title="${toolName(t,w)} · ${i+1}">${t==='blob'?IC.blob:IC[t]}</button>`).join('');
  dock.querySelectorAll('.tool').forEach(b=>b.onclick=()=>{ sand.tool=b.dataset.t; buildDock(); });

function segHTML(label,vals,cur,key){
  return `<div class="seg on-card" role="radiogroup" aria-label="${label}">${vals.map(([v,l,al])=>`<button role="radio" data-k="${key}" data-v="${v}" aria-checked="${v===cur}"${al?` aria-label="${al}"`:''}>${l}</button>`).join('')}</div>`;
}
function buildCtx(){
  const w=sand.world, t=sand.tool, o=sand.opt, el=$('ctx');
  let opts='';
  const size=segHTML('Розмір',[[0,'1'],[1,'3'],[2,'5']],o.size,'size');
  const sym=segHTML('Симетрія',[[0,'—','без симетрії'],[1,'↔','дзеркало'],[2,'✣','чотири чверті']],o.sym,'sym');
  const rotB=`<button class="ib" data-act="rot" aria-label="Повернути на 90°" style="transform:rotate(${o.rot*90}deg)">${IC.rot}</button>`;
  if(w.type==='grid'){
    if(t==='brush'||t==='anti') opts=size+sym;
    else if(t==='wire') opts=sym;
    else if(t==='eraser') opts=size+`<button class="ib" data-act="clear" aria-label="Стерти все">${IC.trash}</button>`;
    else if(t==='soup') opts=segHTML('Розмір супу',[[8,'8'],[16,'16'],[32,'32']],o.soup,'soup');
    else if(t==='bomb') opts=segHTML('Радіус',[[6,'6'],[12,'12'],[24,'24']],o.bombR,'bombR');
    else if(t==='stamp'){ const L=w.wire?WIRE_STAMPS:LIFE_STAMPS, cur=w.wire?o.wireStampIx:o.stampIx;
      opts=`<div class="scroll" role="radiogroup" aria-label="Фігура">${L.map((q,i)=>`<button class="chip" role="radio" data-k="${w.wire?'wireStampIx':'stampIx'}" data-v="${i}" aria-checked="${i===cur}">${q.n}</button>`).join('')}</div>`+rotB; }
  } else if(w.type==='ant'){
    if(t==='brush'||t==='eraser') opts=size; else if(t==='ant') opts=rotB;
  } else if(w.type==='lenia'){
    if(t==='brush'||t==='eraser') opts=segHTML('Розмір',[[3,'S'],[6,'M'],[10,'L']],o.lsize,'lsize'); else if(t==='blob') opts=rotB;
  } else if(w.type==='wolf'){
    if(t==='cell') opts=`<button class="chip" data-act="one">1 клітина</button><button class="chip" data-act="rnd">Випадково</button>`;
  }
  el.innerHTML=`<span class="tname">${toolName(t,w)}</span>${opts?`<div class="opts">${opts}</div>`:`<span class="tdesc">${toolDesc(t,w)}</span>`}`;
  el.querySelectorAll('[data-k]').forEach(b=>b.onclick=()=>{ o[b.dataset.k]=+b.dataset.v; buildCtx(); setHint(); });
  el.querySelectorAll('[data-act]').forEach(b=>b.onclick=()=>{
    const a=b.dataset.act;
    if(a==='rot'){ o.rot=(o.rot+1)%4; b.style.transform=`rotate(${o.rot*90}deg)`; }
    if(a==='clear') clearField();
    if(a==='one'||a==='rnd'){ pushUndo(); w.seed(a==='one'?'one':'rnd'); updateReadouts(); }
  });
}

function buildList(){

  el.innerHTML=`<p class="lead">Фігури, машини й інші всесвіти. Відкрий будь-який — і перенеси в пісочницю, щоб розібрати на частини.</p>`+

function updateExhibitStatus(){
  const it=ex.item, w=ex.world; if(!it||!w) return;
  const S=$('goalS'), B=$('goalB');
  if(it.meta&&S&&w.state==='ready'){ const g=w.gen%META_PERIOD; S.textContent=`${fmt(g)} / 35\u202f328`; B.style.width=(g/META_PERIOD*100).toFixed(1)+'%'; }
  else if(it.goal&&S){ const done=w.gen>=it.goal;
    B.style.width=Math.min(100,w.gen/it.goal*100).toFixed(1)+'%'; S.className='status'+(done?' ok':'');
    S.textContent=done?(it.goalLabel?'✓ шосе вже будується':`✓ вгомонилось на ${fmt(it.goal)}-му`):(it.goalLabel?`до шосе ≈ ${Math.floor(w.gen/it.goal*100)}%`:`до ${fmt(it.goal)}: ${Math.floor(w.gen/it.goal*100)}%`); }
  if(it.gate){ const o=$('gateOut'); if(o){ const [ox,oy]=GATE_O, z=OUT_ZONE; let c=0;
    for(let y=oy+z[1];y<oy+z[3]&&!c;y++) for(let x=ox+z[0];x<ox+z[2];x++) if(w.cur[y*GN+x]){ c=1; break; }
    o.className='status'+(c?' ok':''); o.textContent=c?'вихід: ● 1':'вихід: ○ 0'; } }
}

/* ───── екрани ───── */
const ORDER={sandbox:0,'3d':1,list:2,exhibit:3};
let swapping=null;
function setScreen(s,opt){
  if(s===screen&&!(opt&&opt.force)) return;
  const from=screen, dir=(ORDER[s]??0)>=(ORDER[from]??0)?1:-1;
  const parts=()=>['stage','list','info','ctx','dock'].map(id=>$(id)).filter(el=>!el.classList.contains('hidden'));
  if(REDUCED.matches||(opt&&opt.instant)||!app.animate){ applyScreen(s); return; }
  if(swapping) swapping.forEach(an=>an.cancel());
  const outs=parts().map(el=>el.animate([{opacity:1,transform:'none'},{opacity:0,transform:`translateX(${-dir*14}px)`}],{duration:110,easing:'cubic-bezier(.5,0,.75,0)',fill:'forwards'}));
  swapping=outs;
  Promise.all(outs.map(an=>an.finished.catch(()=>{}))).then(()=>{
    outs.forEach(an=>an.cancel()); applyScreen(s);
    swapping=parts().map(el=>el.animate([{opacity:0,transform:`translateX(${dir*18}px)`},{opacity:1,transform:'none'}],{duration:220,easing:'cubic-bezier(.2,.9,.3,1)'}));
  });
}
function applyScreen(s){
  // кожен режим пам’ятає, чи біг і з якою швидкістю; той, що лишаємо, рахується далі у фоні
  const prev=A(); prev.running=running; prev.speedIx=speedIx;
  if(screen==='exhibit'&&s!=='exhibit'){ ex.running=false; }
  screen=s; app.dataset.screen=s;
  const cur=A(); running=!!cur.running; speedIx=cur.speedIx??1; syncPlay(); syncSpeed(); wake();
  const is=x=>s===x;
  $('head').classList.toggle('hidden',is('exhibit'));
  $('exHead').classList.toggle('hidden',!is('exhibit'));
  $('list').classList.toggle('hidden',!is('list'));
  stage.classList.toggle('hidden',is('list'));
  $('tray').classList.toggle('hidden',is('list'));
  $('info').classList.toggle('hidden',!is('exhibit'));
  const ed=is('sandbox')||is('3d');
  $('ctx').classList.toggle('hidden',!ed);
  $('dock').classList.toggle('hidden',!ed);
  $('worldBtn').classList.toggle('hidden',!ed);
  $('undoBtn').classList.toggle('hidden',!ed); $('redoBtn').classList.toggle('hidden',!ed); $('resetBtn').classList.toggle('hidden',!ed); disarmReset();
  [...$('modeSeg').children].forEach(b=>b.setAttribute('aria-checked',b.dataset.mode===(is('exhibit')?'list':s)));
  if(is('list')){ buildList(); ex.world=null; }
  if(is('3d')) enter3d(); else if(is('sandbox')){ buildDock(); syncWorldChip(); }
  syncHistory(); syncCursor(); resize(); if(t3.view) t3.view.resize();
  if(!is('list')){ updateReadouts(); setHint(); }
}
$('modeSeg').querySelectorAll('button').forEach(b=>b.onclick=()=>{ if(b.dataset.mode!==screen) setScreen(b.dataset.mode); });
$('backBtn').onclick=()=>setScreen('list');

/* ───── жести ───── */
const pts=new Map(); let gesture=null;
function applyAt(x,y,first){
  const w=sand.world, o=sand.opt;
  o.stampCells=w.type==='grid'?(w.wire?WIRE_STAMPS[o.wireStampIx]:LIFE_STAMPS[o.stampIx]).c:null;
  w.apply(sand.tool,x,y,first,o);
  if(o.sym&&symTool()){
    const [cx,cy]=symCenter(), mx=2*cx-x-1, my=2*cy-y-1;
    w.apply(sand.tool,mx,y,first,o);
    if(o.sym===2){ w.apply(sand.tool,x,my,first,o); w.apply(sand.tool,mx,my,first,o); }
  }
}
stage.addEventListener('pointerdown',e=>{
  if(screen==='list'||screen==='3d'||e.target.closest('button')) return;
  stage.setPointerCapture(e.pointerId); tick();
  const r=stage.getBoundingClientRect(); pts.set(e.pointerId,{x:e.clientX-r.left,y:e.clientY-r.top});
  if(pts.size===1){
    const p=pts.get(e.pointerId);
    if(screen==='sandbox'&&sand.tool!=='hand'&&e.button===0){
      const [cx,cy]=toCell(sand.cam,p.x,p.y);
      pushUndo(); sand.symC=[Math.round(sand.cam.x),Math.round(sand.cam.y)];
      gesture={type:'tool',lx:cx,ly:cy}; applyAt(cx,cy,true);
      if(['stamp','bomb','soup','blob','ant'].includes(sand.tool)) buzz(8);
      updateReadouts(); return;
    }
    gesture={type:'tap',sx:e.clientX,sy:e.clientY,t:performance.now(),lx:e.clientX,ly:e.clientY};
  } else if(pts.size===2){
    // другий палець: штрих скасовуємо, якщо він щойно почався — це був жест масштабу
    if(gesture&&gesture.type==='tool'&&!gesture.moved&&sand.undo.length){ sand.world.restore(sand.undo.pop()); syncHistory(); }
    const [a,b]=[...pts.values()]; gesture={type:'pinch',d:Math.hypot(a.x-b.x,a.y-b.y),mx:(a.x+b.x)/2,my:(a.y+b.y)/2};
  }
});
stage.addEventListener('pointermove',e=>{
  if(!pts.has(e.pointerId)||!gesture) return;
  const r=stage.getBoundingClientRect(); pts.set(e.pointerId,{x:e.clientX-r.left,y:e.clientY-r.top});
  const cam=A().cam;
  if(gesture.type==='pinch'&&pts.size>=2){
    const [a,b]=[...pts.values()], d=Math.hypot(a.x-b.x,a.y-b.y), mx=(a.x+b.x)/2, my=(a.y+b.y)/2;
    cam.x-=(mx-gesture.mx)/cam.s; cam.y-=(my-gesture.my)/cam.s; if(gesture.d>0) zoomAt(mx,my,d/gesture.d);
    gesture.d=d; gesture.mx=mx; gesture.my=my; return;
  }
  if(gesture.type==='tool'){
    tick(); const p=pts.get(e.pointerId), [cx,cy]=toCell(sand.cam,p.x,p.y);
    const n=Math.max(Math.abs(cx-gesture.lx),Math.abs(cy-gesture.ly)); if(n) gesture.moved=true;
    for(let k=1;k<=n;k++) applyAt(Math.round(gesture.lx+(cx-gesture.lx)*k/n),Math.round(gesture.ly+(cy-gesture.ly)*k/n),false);
    gesture.lx=cx; gesture.ly=cy; updateReadouts(); return;
  }
  if(gesture.type==='tap'&&Math.hypot(e.clientX-gesture.sx,e.clientY-gesture.sy)>6) gesture.type='pan';
  if(gesture.type==='pan'){ cam.x-=(e.clientX-gesture.lx)/cam.s; cam.y-=(e.clientY-gesture.ly)/cam.s; gesture.lx=e.clientX; gesture.ly=e.clientY; }
});
function endPointer(e){
  if(!pts.has(e.pointerId)) return;
  const p=pts.get(e.pointerId); pts.delete(e.pointerId);
  if(gesture&&gesture.type==='tap'&&e.type==='pointerup'&&performance.now()-gesture.t<450&&screen==='sandbox'){
    // Рука: тиць перемикає клітину сітки
    const w=sand.world; if(w.type==='grid'&&!w.wire){ const [cx,cy]=toCell(sand.cam,p.x,p.y); if(w.inside(cx,cy)){ pushUndo(); tick(); w.setState(cx,cy,w.get(cx,cy)===1?0:1); updateReadouts(); } }
  }
  if(pts.size===0) gesture=null;
  else if(pts.size===1){ const q=[...pts.values()][0], r=stage.getBoundingClientRect(); gesture={type:'pan',lx:q.x+r.left,ly:q.y+r.top}; }
}
stage.addEventListener('pointerup',endPointer); stage.addEventListener('pointercancel',endPointer);
stage.addEventListener('wheel',e=>{ if(screen==='3d'||!A().world) return; e.preventDefault(); const r=stage.getBoundingClientRect(); zoomAt(e.clientX-r.left,e.clientY-r.top,Math.exp(-e.deltaY*.0015)); },{passive:false});
stage.addEventListener('contextmenu',e=>e.preventDefault());

addEventListener('keydown',e=>{
  if(e.key==='Escape'){ if(sheet.classList.contains('on')) closeSheet(); else if(screen==='exhibit') setScreen('list'); return; }
  if(sheet.classList.contains('on')||e.target.closest('input')) return;
  if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='z'){ e.preventDefault(); if(screen==='sandbox') (e.shiftKey?redo:undo)(); return; }
  if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='y'){ e.preventDefault(); if(screen==='sandbox') redo(); return; }
  if(e.target.closest('button')&&(e.key===' '||e.key==='Enter')) return;
  if(screen==='list') return;
  if(e.key===' '){ e.preventDefault(); playBtn.click(); }
  else if(e.key==='ArrowRight') $('stepBtn').click();
  else if(e.key==='+'||e.key==='=') { if(screen==='3d') t3.view.orbit.r*=.8; else zoomAt(W/2,H/2,1.25); }
  else if(e.key==='-') { if(screen==='3d') t3.view.orbit.r*=1.25; else zoomAt(W/2,H/2,.8); }
  else if(e.key==='0') $('fitBtn').click();
  else if(screen==='sandbox'&&/^[1-9]$/.test(e.key)){ const t=sand.world.tools[+e.key-1]; if(t){ sand.tool=t; buildDock(); } }
  else if(screen==='3d'&&/^[1-9]$/.test(e.key)){ const t=TOOLS3[+e.key-1]; if(t){ t3.tool=t.id; buildDock3(); } }
});

/* ───── цикл ───── */
let last=performance.now(), fxAcc=0, lastDraw=0;
function frame(t){
  requestAnimationFrame(frame);
  const cur=A(), w0=cur.world, idle=t-wakeT, fxOn=!!(w0&&w0.fxActive&&w0.fxActive());
  const bg=[sand,t3].filter(m=>(screen==='list'||m!==cur)&&m.running&&m.world);   // режими, що біжать у фоні
  if(!running&&!bg.length&&!fxOn&&idle>1600){ last=t; return; }
  // без дотиків — 30 кадрів/с: удвічі менше роботи CPU й GPU
  if(idle>300&&t-lastDraw<31) return;
  lastDraw=t;
  const dt=Math.min(.1,(t-last)/1000); last=t; tick();
  for(const m of bg){ m.world.advance(dt,m.speedIx??1,bg.length&&running?5:8); recordSpark(m); }
  if(screen==='list') return;
  if(screen==='3d'&&t3.world){
    const w=t3.world;
    if(!running&&w.fxActive()){ fxAcc+=dt*20; while(fxAcc>=1){ w.fxTick(); fxAcc--; } updateReadouts(); } else if(!running) fxAcc=0;
    if(running){ w.advance(dt,speedIx,bg.length?18:30); updateReadouts(); pushSpark(); }
    if(t3.view) t3.view.render(REDUCED.matches?0:running?clamp(1200/w.speeds[speedIx],140,420):320);
  } else {
    const w=A().world;
    if(w){
      if(!running&&w.fxActive()){ fxAcc+=dt*24; while(fxAcc>=1){ w.fxTick(); fxAcc--; } updateReadouts(); } else fxAcc=0;
      if(running){ w.advance(dt,speedIx,bg.length?8:12); updateReadouts(); pushSpark(); }
      draw();
    }
  }
}

/* площина пензля: якщо є розріз — малюємо на ньому, інакше на горизонтальному шарі */
function penPlane(){ const v=t3.view, o=t3.opt; if(v&&v.cut.axis) return {axis:v.cut.axis,pos:v.cut.pos}; return {axis:2,pos:clamp(o.layer,0,(t3.world?t3.world.N:48)-1)}; }
function syncPen(){ const v=t3.view; if(!v) return; const p=penPlane(); v.pen.on=t3.tool==='pen'&&t3.opt.pmode==='layer'; v.pen.axis=p.axis; v.pen.pos=p.pos; }
function stroke3(px,py,first){
  const v=t3.view, w=t3.world, o=t3.opt;
  if(t3.tool==='pen'){
    let c=null;
    if(o.pmode==='surface'){ const hit=v.pick(px,py); if(hit){ c=hit.cell.slice(); if(!hit.empty){ c[0]+=hit.normal[0]; c[1]+=hit.normal[1]; c[2]+=hit.normal[2]; } } }
    else { const p=penPlane(); c=v.pickPlane(px,py,p.axis,p.pos); }
    if(!c) return; const r=o.psize;
    for(let dz=-r;dz<=r;dz++)for(let dy=-r;dy<=r;dy++)for(let dx=-r;dx<=r;dx++) w.setState(c[0]+dx,c[1]+dy,c[2]+dz,1,9,(Math.abs(dx)+Math.abs(dy)+Math.abs(dz))*25);
  } else if(t3.tool==='break'){
    const hit=v.pick(px,py); if(!hit||hit.empty) return; const [x,y,z]=hit.cell, r=o.esize;
    for(let dz=-r;dz<=r;dz++)for(let dy=-r;dy<=r;dy++)for(let dx=-r;dx<=r;dx++) w.setState(x+dx,y+dy,z+dz,0,5,0);
  }
}
function setHint3(){

}
function apply3(px,py){
  const v=t3.view, w=t3.world, o=t3.opt, tool=t3.tool; if(tool==='cut'||tool==='pen'||tool==='break') return;
  const hit=v.pick(px,py); if(!hit) return;
  tick(); pushUndo();
  let [x,y,z]=hit.cell;
  if(tool==='build'){
    if(!hit.empty){ x+=hit.normal[0]; y+=hit.normal[1]; z+=hit.normal[2]; }
    const r=o.bsize; for(let dz=-r;dz<=r;dz++)for(let dy=-r;dy<=r;dy++)for(let dx=-r;dx<=r;dx++) w.setState(x+dx,y+dy,z+dz,1,9,(Math.abs(dx)+Math.abs(dy)+Math.abs(dz))*30);
  } else if(tool==='break'){
    const r=o.esize; for(let dz=-r;dz<=r;dz++)for(let dy=-r;dy<=r;dy++)for(let dx=-r;dx<=r;dx++) w.setState(x+dx,y+dy,z+dz,0,5,0);
  } else if(tool==='soup'){ w.soup(x,y,z,o.soup,o.dens); buzz(8); }
  else if(tool==='bomb'){ w.explos.push({x,y,z,r:0,R:o.bombR}); buzz(12); }
  updateReadouts();
}
function bind3dInput(c){
  const P=new Map(); let g=null;
  const rect=()=>c.getBoundingClientRect();
  const drawTool=()=>t3.tool==='pen'||t3.tool==='break';
  const rot=(dx,dy)=>{ const o=t3.view.orbit; o.theta-=dx*.008; o.phi=clamp(o.phi-dy*.008,.08,Math.PI-.08); };
  const pan=(dx,dy)=>{ const v=t3.view, o=v.orbit, cam=v.camera, k=o.r*.0016;
    const right=new THREE.Vector3().setFromMatrixColumn(cam.matrixWorld,0), up=new THREE.Vector3().setFromMatrixColumn(cam.matrixWorld,1);
    o.tx+=(-right.x*dx+up.x*dy)*k; o.ty+=(-right.y*dx+up.y*dy)*k; o.tz+=(-right.z*dx+up.z*dy)*k; };
  c.addEventListener('pointerdown',e=>{
    c.setPointerCapture(e.pointerId); const r=rect(), p={x:e.clientX-r.left,y:e.clientY-r.top}; P.set(e.pointerId,p); tick();
    if(P.size===1){
      if(drawTool()&&e.button===0&&!e.shiftKey){ pushUndo(); g={type:'draw',lx:p.x,ly:p.y,moved:false}; stroke3(p.x,p.y,true); updateReadouts(); return; }
      g={type:'tap',sx:e.clientX,sy:e.clientY,lx:e.clientX,ly:e.clientY,t:performance.now(),pan:e.button===2||e.shiftKey};
    } else if(P.size===2){
      // другий палець одразу після дотику — це був жест навігації, а не мазок
      if(g&&g.type==='draw'&&!g.moved&&t3.undo.length){ t3.world.restore(t3.undo.pop()); syncHistory(); updateReadouts(); }
      const [a,b]=[...P.values()]; g={type:'two',d:Math.hypot(a.x-b.x,a.y-b.y),mx:(a.x+b.x)/2,my:(a.y+b.y)/2};
    }
  });
  c.addEventListener('pointermove',e=>{
    if(!P.has(e.pointerId)||!g) return; const r=rect(), p={x:e.clientX-r.left,y:e.clientY-r.top}; P.set(e.pointerId,p);
    const o=t3.view.orbit, N=t3.world.N;
    if(g.type==='two'&&P.size>=2){ const [a,b]=[...P.values()], d=Math.hypot(a.x-b.x,a.y-b.y), mx=(a.x+b.x)/2, my=(a.y+b.y)/2;
      if(g.d>0&&d>0) o.r=clamp(o.r*g.d/d,N*.5,N*8); rot(mx-g.mx,my-g.my); g.d=d; g.mx=mx; g.my=my; return; }
    if(g.type==='draw'){ tick(); const dx=p.x-g.lx, dy=p.y-g.ly, n=Math.ceil(Math.hypot(dx,dy)/5); if(n) g.moved=true;
      for(let k=1;k<=n;k++) stroke3(g.lx+dx*k/n,g.ly+dy*k/n,false); if(n){ g.lx=p.x; g.ly=p.y; updateReadouts(); } return; }
    if(g.type==='tap'&&Math.hypot(e.clientX-g.sx,e.clientY-g.sy)>6) g.type=g.pan?'pan':'rot';
    const dx=e.clientX-g.lx, dy=e.clientY-g.ly; g.lx=e.clientX; g.ly=e.clientY;
    if(g.type==='rot') rot(dx,dy); else if(g.type==='pan') pan(dx,dy);
  });
  const end=e=>{ if(!P.has(e.pointerId)) return; const p=P.get(e.pointerId); P.delete(e.pointerId);
    if(g&&g.type==='tap'&&e.type==='pointerup'&&performance.now()-g.t<450) apply3(p.x,p.y);
    if(!P.size) g=null; else if(P.size===1&&g&&g.type==='two'){ const q=[...P.values()][0], r=rect(); g={type:'rot',lx:q.x+r.left,ly:q.y+r.top}; } };
  c.addEventListener('pointerup',end); c.addEventListener('pointercancel',end);
  c.addEventListener('wheel',e=>{ e.preventDefault(); const o=t3.view.orbit; o.r=clamp(o.r*Math.exp(e.deltaY*.0015),t3.world.N*.5,t3.world.N*8); },{passive:false});
  c.addEventListener('contextmenu',e=>e.preventDefault());
}

    <div class="legend"><span><i style="background:var(--clay)"></i>народилась</span><span><i style="background:var(--chart-1)"></i>низ куба</span><span><i style="background:var(--ink)"></i>верх куба</span><span><i style="background:var(--ink-muted)"></i>тліє</span><span><i style="background:var(--danger)"></i>тіснява, вибух</span></div>
    <div class="row"><button class="btn btn-secondary" data-act="to2d">${IC.brush}Перенести в 2D</button><button class="btn btn-secondary" data-act="seed">${IC.soup}Засіяти наново</button><button class="btn btn-secondary" data-act="clear">${IC.trash}Очистити</button></div>`;
  openSheet('Всесвіт 3D',html,body=>{

    body.querySelectorAll('[data-pr]').forEach(b=>b.onclick=()=>{ const q=R3_PRESETS[+b.dataset.pr]; pushUndo(); w.setRule(q); w.clear(); w.seed(q.seed); updateReadouts(); toast('Правило: '+q.n); re(); });

      if(i>=0) arr.splice(i,1); else { arr.push(n); arr.sort((a,b)=>a-b); }

    body.querySelectorAll('[data-c]').forEach(b=>b.onclick=()=>{ w.setRule({...w.rule,C:clamp(w.rule.C+(+b.dataset.c),2,12)}); re(); });
    body.querySelectorAll('[data-k]').forEach(b=>b.onclick=()=>{
      if(b.dataset.k==='nb'){ const nb=b.dataset.v, lim=nb==='VN'?6:26; w.setRule({...w.rule,nb,B:w.rule.B.filter(n=>n<=lim),S:w.rule.S.filter(n=>n<=lim)}); re(); }
      if(b.dataset.k==='size'){ const N=+b.dataset.v; if(N===w.N) return; setRunning(false); w.alloc(N); w.setRule(w.rule); const q=preset3Of(w.rule); w.seed(q?q.seed:{s:16,d:.3});

/* ───────── перенесення фігур між 2D і 3D ───────── */
function to3D(){
  const s=sand.world; if(s.type!=='grid'||s.wire){ toast('Переносити можна лише клітинні всесвіти'); return; }
  const cells=[]; if(s.bx1>=0) for(let y=s.by0;y<=s.by1;y++) for(let x=s.bx0;x<=s.bx1;x++) if(s.cur[y*GN+x]===1) cells.push([x,y]);
  if(!cells.length){ toast('У 2D поки порожньо — намалюй щось'); return; }
  ensure3dWorld(); const w=t3.world, N=w.N;
  let cx=(s.bx0+s.bx1)/2, cy=(s.by0+s.by1)/2;
  if(s.bx1-s.bx0>=N||s.by1-s.by0>=N){ cx=sand.cam.x; cy=sand.cam.y; }      // завелике — беремо те, що видно в центрі
  const v=t3.view, layer=v&&v.cut.axis===2?v.cut.pos:clamp(t3.opt.layer,0,N-1);
  t3.undo.push(w.snapshot()); if(t3.undo.length>20) t3.undo.shift(); t3.redo=[];
  tick(); let n=0;
  for(const [x,y] of cells){ const X=Math.round(x-cx+N/2-.5), Z=Math.round(y-cy+N/2-.5); if(!w.inside(X,layer,Z)) continue;
    w.setState(X,layer,Z,1,9,Math.max(Math.abs(X-N/2),Math.abs(Z-N/2))*18); n++; }
  t3.tool='pen'; t3.opt.pmode='layer'; t3.opt.layer=layer;
  setScreen('3d'); toast(`Перенесено ${fmt(n)} клітин у шар ${layer} з ${N}`);
}
function to2D(){
  ensure3dWorld(); const w=t3.world, N=w.N, v=t3.view;
  let axis=2, pos=0;
  if(v&&v.cut.axis){ axis=v.cut.axis; pos=v.cut.pos; }
  else { let best=-1; for(let y=0;y<N;y++){ let c=0; for(let z=0;z<N;z++) for(let x=0;x<N;x++) if(w.s[w.idx(x,y,z)]===1) c++; if(c>best){ best=c; pos=y; } } }
  const cells=[];
  for(let a=0;a<N;a++) for(let b=0;b<N;b++){
    let x,y,z; if(axis===1){ x=pos; z=a; y=N-1-b; } else if(axis===2){ y=pos; x=a; z=b; } else { z=pos; x=a; y=N-1-b; }
    if(w.s[w.idx(x,y,z)]===1) cells.push([a,b]); }
  if(!cells.length){ toast('У цьому шарі 3D немає живих клітин'); return; }
  let s=sand.world;
  if(s.type!=='grid'||s.wire){ setSandWorld(FAMILIES[0].make()); s=sand.world; toast('2D переключено на «Життя»'); }
  else { sand.undo.push(s.snapshot()); if(sand.undo.length>40) sand.undo.shift(); sand.redo=[]; }
  const cx=Math.round(sand.cam.x), cy=Math.round(sand.cam.y); tick();
  for(const [a,b] of cells) s.setState(cx+a-(N>>1),cy+b-(N>>1),1,9,Math.max(Math.abs(a-N/2),Math.abs(b-N/2))*18);
  setScreen('sandbox'); toast(`Перенесено ${fmt(cells.length)} клітин зі шару ${'XYZ'[axis-1]} = ${pos}`);
}

})();
</script>
